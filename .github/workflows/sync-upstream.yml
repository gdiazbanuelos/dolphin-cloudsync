name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * *'  # runs daily at 6am UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: git remote add upstream https://github.com/dolphin-emu/dolphin.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream into master
        id: merge
        run: |
          git merge upstream/master --no-edit
        continue-on-error: true

      - name: Auto-resolve known conflicts
        if: steps.merge.outcome == 'failure'
        run: |
          # .vcxproj files: if upstream still has the file, take their version.
          # Upstream removed all Visual Studio project files (July 2026, moved to
          # CMake-only), so this will always hit the "else" branch now — but our
          # Windows build (build-windows.yml) still uses MSBuild against these
          # files, so we keep ours instead of deleting them.
          for f in $(git diff --name-only --diff-filter=U | grep '\.vcxproj$'); do
            if git show upstream/master:"$f" > /dev/null 2>&1; then
              echo "Auto-resolving $f with upstream version"
              git checkout --theirs "$f"
              git add "$f"
            else
              echo "Auto-resolving $f — deleted in upstream, keeping ours (still needed for MSBuild)"
              git checkout --ours "$f"
              git add "$f"
            fi
          done

          # Our custom file — always keep ours.
          if git diff --name-only --diff-filter=U | grep -q 'GCMemcardDirectory.cpp'; then
            echo "Auto-resolving GCMemcardDirectory.cpp with our version"
            git checkout --ours "Source/Core/Core/HW/GCMemcard/GCMemcardDirectory.cpp"
            git add "Source/Core/Core/HW/GCMemcard/GCMemcardDirectory.cpp"
          fi

          # Check if all conflicts are resolved
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git commit --no-edit

      - name: Check for unresolved conflicts
        if: steps.merge.outcome == 'failure'
        run: echo "All conflicts resolved automatically"

      - name: Restore MSBuild project files silently removed by upstream
        if: success()
        run: |
          # Not every upstream deletion trips a merge conflict — if we never
          # touched a file ourselves, git applies the deletion cleanly with no
          # warning. That's what happened to Source/dolphin-emu.sln (and
          # potentially sibling .vcxproj/.vcxproj.filters files): upstream's
          # "Remove Visual Studio Projects and Solutions" commit deleted them,
          # nothing conflicted, and build-windows.yml broke silently days later.
          # KNOWN_GOOD is the last commit before that removal was merged in —
          # restore any of those paths that are currently missing from disk.
          KNOWN_GOOD=d6e803e63d7a809fcafb4e39c79bdf4aabb49c79
          git ls-tree -r --name-only "$KNOWN_GOOD" -- Source Languages \
            | grep -E '\.(sln|vcxproj|vcxproj\.filters)$' \
            | while read -r f; do
                if [ ! -f "$f" ]; then
                  echo "Restoring missing build file: $f"
                  git checkout "$KNOWN_GOOD" -- "$f"
                  git add "$f"
                fi
              done

          if ! git diff --cached --quiet; then
            git commit -m "Restore MSBuild project files silently removed by upstream merge"
          fi

      - name: Push merged changes
        if: success()
        run: git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/gdiazbanuelos/dolphin-cloudsync.git master
