name: Build Windows

on:
  push:
    branches: [ master ]
    paths:
      - 'Source/**'
      - 'Data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        run: cmake --preset ninja-release-x64

      - name: Build
        run: cmake --build --preset ninja-build-release-x64 --target dolphin-emu

      - name: Get version
        id: version
        shell: bash
        run: echo "version=v$(date -u +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="HEAD"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          fi

          # Each sync-upstream run creates a merge commit whose second parent is
          # upstream's tip at that time. Walking p1..p2 for every such merge in
          # range gives exactly the commits that came in from upstream, regardless
          # of which of our own commits (README edits, workflow fixes) sit in between.
          CHANGELOG=$(git log $RANGE --merges --pretty=format:'%H %P' | while read -r merge p1 p2; do
            if [ -n "$p2" ]; then
              git log "$p1..$p2" --no-merges --pretty=format:'- %s'
            fi
          done | sort -u)

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No upstream changes since last release"
          fi

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Zip release folder
        shell: pwsh
        run: |
          Compress-Archive -Path build\release\x64\Binaries\* -DestinationPath Dolphin-CloudSync-Windows.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Dolphin CloudSync ${{ steps.version.outputs.version }}
          body: |
            ## What's included
            - Automatic Dropbox cloud save sync via rclone
            - Saves pushed to Dropbox on every in-game save
            - Saves pulled from Dropbox on every game launch
            - Works on Windows and Linux (including Steam Deck)

            ## Setup
            See the [README](https://github.com/gdiazbanuelos/dolphin-cloudsync#cloud-save-feature) for rclone setup instructions.

            ## Changes since last release
            ${{ steps.changelog.outputs.changelog }}
          files: Dolphin-CloudSync-Windows.zip
          prerelease: false
