name: Build Linux AppImage

on:
  push:
    branches: [ master ]
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - 'Data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libgl1-mesa-dev \
            libevdev-dev libusb-1.0-0-dev libudev-dev libpulse-dev libasound2-dev \
            libxi-dev libxrandr-dev libssl-dev qt6-base-dev qt6-base-private-dev \
            libqt6svg6-dev libxkbcommon-dev libvulkan-dev libminiupnpc-dev \
            libbluetooth-dev libcurl4-openssl-dev libsfml-dev

      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          make -j$(nproc)
          make install

      - name: Download linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Package AppImage
        env:
          QMAKE: /usr/bin/qmake6
          OUTPUT: Dolphin-CloudSync-x86_64.AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir appdir \
            --executable ${{ github.workspace }}/install/bin/dolphin-emu \
            --desktop-file Data/dolphin-emu.desktop \
            --icon-file Data/dolphin-emu.png \
            --plugin qt \
            --output appimage

      - name: Get version
        id: version
        run: echo "version=v$(date -u +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="HEAD"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          fi

          # Each sync-upstream run creates a merge commit whose second parent is
          # upstream's tip at that time. Walking p1..p2 for every such merge in
          # range gives exactly the commits that came in from upstream, regardless
          # of which of our own commits (README edits, workflow fixes) sit in between.
          CHANGELOG=$(git log $RANGE --merges --pretty=format:'%H %P' | while read -r merge p1 p2; do
            if [ -n "$p2" ]; then
              git log "$p1..$p2" --no-merges --pretty=format:'- %s'
            fi
          done | sort -u)

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No upstream changes since last release"
          fi

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Dolphin CloudSync ${{ steps.version.outputs.version }}
          body: |
            ## Setup
            See the [README](https://github.com/gdiazbanuelos/dolphin-cloudsync#cloud-save-feature) for rclone setup instructions.

            ## Changes since last release
            ${{ steps.changelog.outputs.changelog }}
          files: Dolphin-CloudSync-x86_64.AppImage
          make_latest: true
          prerelease: false
